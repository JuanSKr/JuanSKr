<text x="300" y="76" class="sans" font-size="42" font-weight="800" letter-spacing="6" fill="#EDEBE6">PUNTO Y TRAMA</text><text x="300" y="128" class="sans" font-size="20" fill="#EDEBE6" fill-opacity=".9">A prepress toolkit for print and graphic arts. Its PDF preflight</text><text x="300" y="156" class="sans" font-size="20" fill="#EDEBE6" fill-opacity=".9">checks bleed, CMYK, Pantone, overprint and ICC profiles. Plus</text><text x="300" y="184" class="sans" font-size="20" fill="#EDEBE6" fill-opacity=".9">sheet optimization, bleed &amp; marks, plates, imposition, calculators.</text><rect x="300" y="224" width="135" height="24" fill="none" stroke="#FF2BD6" stroke-opacity=".7"/><text x="367.5" y="241" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#FF2BD6">PDF PREFLIGHT</text><rect x="445" y="224" width="108" height="24" fill="none" stroke="#FF2BD6" stroke-opacity=".7"/><text x="499.0" y="241" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#FF2BD6">IMPOSITION</text><rect x="563" y="224" width="108" height="24" fill="none" stroke="#FF2BD6" stroke-opacity=".7"/><text x="617.0" y="241" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#FF2BD6">FREE / PRO</text><rect x="681" y="224" width="117" height="24" fill="none" stroke="#FF2BD6" stroke-opacity=".7"/><text x="739.5" y="241" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#FF2BD6">SELF-HOSTED</text><rect x="1086" y="66" width="16" height="16" fill="#00AEEF"/><rect x="1106" y="66" width="16" height="16" fill="#EC008C"/><rect x="1126" y="66" width="16" height="16" fill="#FFF200"/><rect x="1146" y="66" width="16" height="16" fill="#EDEBE6"/><text x="1160" y="100" text-anchor="end" class="mono" font-size="10" letter-spacing="3" fill="#8A8D93">C · M · Y · K</text><g transform="translate(1066 278) translate(0 -64) rotate(-6)" class="pulse"><rect x="-96" y="-22" width="192" height="44" fill="none" stroke="#FF2BD6" stroke-width="3"/><text x="0" y="8" text-anchor="middle" class="mono" font-size="20" font-weight="800" letter-spacing="5" fill="#FF2BD6">PRE-LAUNCH</text></g>
