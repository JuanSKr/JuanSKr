<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="02 ACTIVE DIVISIONS">
<style>.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Helvetica Neue','Segoe UI',Arial,sans-serif} .jp{font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP','Noto Sans CJK JP','MS Gothic',sans-serif}
.blink{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}
.sweep{animation:sw 3.5s ease-in-out infinite} @keyframes sw{0%{transform:translateX(-200px)}100%{transform:translateX(1400px)}}</style>
<defs><linearGradient id="sws2"><stop offset="0" stop-color="#FF1F3D" stop-opacity="0"/><stop offset=".5" stop-color="#FF1F3D"/><stop offset="1" stop-color="#FF1F3D" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="84" fill="#050506"/>
<polygon points="0,14 132,14 150,32 150,70 0,70" fill="#FF1F3D"/>
<text x="22" y="54" class="mono" font-size="28" font-weight="800" fill="#050506">02</text>
<text x="176" y="52" class="sans" font-size="30" font-weight="800" letter-spacing="9" fill="#EDEBE6">ACTIVE DIVISIONS</text>
<text x="1188" y="52" text-anchor="end" class="jp" font-size="22" font-weight="700" letter-spacing="4" fill="#FF1F3D">事業部</text>
<path d="M176 66H1200" stroke="#FF1F3D" stroke-opacity=".35"/>
<rect class="sweep" x="0" y="65" width="200" height="2" fill="url(#sws2)"/>
<text x="176" y="80" class="mono" font-size="10" letter-spacing="3" fill="#8A8D93">SECTION 02 <tspan class="blink" fill="#FF1F3D">▮</tspan></text>
</svg>