<text x="1160" y="52" text-anchor="end" class="mono" font-size="13" letter-spacing="3" fill="#00F0FF"><tspan class="blink">●</tspan> PRODUCT LINE // 2 APPS</text>
<text x="300" y="76" class="sans" font-size="42" font-weight="800" letter-spacing="6" fill="#EDEBE6">KAI</text><text x="404" y="74" class="mono" font-size="13" letter-spacing="3" fill="#8A8D93">DESKTOP APPS // PUBLISHED BY CORPO SOLUTIONS</text><rect x="300" y="128" width="420" height="200" fill="#00F0FF" fill-opacity=".03" stroke="#00F0FF" stroke-opacity=".3"/><path d="M300 140V128H312 M708 128H720V140 M720 316V328H708 M312 328H300V316"
