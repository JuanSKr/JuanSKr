    fill="none" stroke="#00F0FF" stroke-width="2"/><text x="760" y="166" class="sans" font-size="24" font-weight="800" letter-spacing="4" fill="#EDEBE6">KAI VOICE</text><text x="1140" y="164" text-anchor="end" class="mono" font-size="12" letter-spacing="1" fill="#00F0FF"></text><path d="M760 180H1140" stroke="#00F0FF" stroke-opacity=".25"/><text x="760" y="208" class="sans" font-size="15.5" fill="#EDEBE6" fill-opacity=".88">High-accuracy speech recognition.</text><text x="760" y="232" class="sans" font-size="15.5" fill="#EDEBE6" fill-opacity=".88">Transcription in about one second.</text><text x="760" y="256" class="sans" font-size="15.5" fill="#EDEBE6" fill-opacity=".88">Talk instead of typing.</text><rect x="760" y="288" width="162" height="24" fill="none" stroke="#00F0FF" stroke-opacity=".7"/><text x="841.0" y="305" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#00F0FF">SPEECH RECOGNITION</text><rect x="932" y="288" width="42" height="24" fill="none" stroke="#00F0FF" stroke-opacity=".7"/><text x="953.0" y="305" text-anchor="middle" class="mono" font-size="11" letter-spacing="1" fill="#00F0FF">~1s</text><g class="wave" transform="translate(1052 146)"><rect x="0" y="0" width="5" height="28" fill="#00F0FF" style="animation-delay:-0.00s"/><rect x="9" y="0" width="5" height="28" fill="#00F0FF" style="animation-delay:-0.37s"/><rect x="18" y="0" width="5" height="28" fill="#00F0FF" style="animation-delay:-0.74s"/><rect x="27" y="0" width="5" height="28" fill="#00F0FF" style="animation-delay:-0.01s"/><rect x="36" y="0" width="5" height="28" fill="#00F0FF" style="animation-delay:-0.38s"/><rect x="45" y="0" width="5" height="28" fill="#00F0FF" style="animation-delay:-0.75s"/><rect x="54" y="0" width="5" height="28" fill="#00F0FF" style="animation-delay:-0.02s"/><rect x="63" y="0" width="5" height="28" fill="#00F0FF" style="animation-delay:-0.39s"/><rect x="72" y="0" width="5" height="28" fill="#00F0FF" style="animation-delay:-0.76s"/><rect x="81" y="0" width="5" height="28" fill="#00F0FF" style="animation-delay:-0.03s"/><rect x="90" y="0" width="5" height="28" fill="#00F0FF" style="animation-delay:-0.40s"/><rect x="99" y="0" width="5" height="28" fill="#00F0FF" style="animation-delay:-0.77s"/></g>
