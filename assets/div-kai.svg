<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-label="DIV-03">
<defs>
  <pattern id="gridd3" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#FF1F3D" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <pattern id="scand3" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" fill-opacity=".35"/>
  </pattern>
  <pattern id="hazd3" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="16" fill="#FFC72C"/>
  </pattern>
  <linearGradient id="beamd3" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#FF1F3D" stop-opacity="0"/>
    <stop offset="1" stop-color="#FF1F3D" stop-opacity=".22"/>
  </linearGradient>
  <radialGradient id="glowd3" cx=".3" cy=".45" r=".7">
    <stop offset="0" stop-color="#FF1F3D" stop-opacity=".18"/>
    <stop offset="1" stop-color="#FF1F3D" stop-opacity="0"/>
  </radialGradient></defs>
<style>.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Helvetica Neue','Segoe UI',Arial,sans-serif} .jp{font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP','Noto Sans CJK JP','MS Gothic',sans-serif}
.blink{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}
.pulse{animation:p 2.4s ease-in-out infinite} @keyframes p{0%,100%{opacity:.95}50%{opacity:.45}}
.beam{animation:sc 4.5s linear infinite} @keyframes sc{from{transform:translateY(-80px)}to{transform:translateY(390px)}}
.wave rect{transform-box:fill-box;transform-origin:center;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.knob{animation:kn 4s ease-in-out infinite} @keyframes kn{0%,15%{transform:translateX(0)}25%,85%{transform:translateX(26px)}95%,100%{transform:translateX(0)}}</style>
