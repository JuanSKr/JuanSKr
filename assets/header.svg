<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="CORPO — Juan, Chief Executive Officer">
<defs>
  <pattern id="gridh" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#FF1F3D" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <pattern id="scanh" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" fill-opacity=".35"/>
  </pattern>
  <pattern id="hazh" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="16" fill="#FFC72C"/>
  </pattern>
  <linearGradient id="beamh" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#FF1F3D" stop-opacity="0"/>
    <stop offset="1" stop-color="#FF1F3D" stop-opacity=".22"/>
  </linearGradient>
  <radialGradient id="glowh" cx=".3" cy=".45" r=".7">
    <stop offset="0" stop-color="#FF1F3D" stop-opacity=".18"/>
    <stop offset="1" stop-color="#FF1F3D" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="sliceA"><rect x="0" y="0" width="700" height="34"><animate attributeName="y" values="0;96;40;118;12;0" dur="3.2s" repeatCount="indefinite" calcMode="discrete"/></rect></clipPath>
  <clipPath id="sliceB"><rect x="0" y="70" width="700" height="18"><animate attributeName="y" values="70;10;104;55;70" dur="2.3s" repeatCount="indefinite" calcMode="discrete"/></rect></clipPath>
  <g id="wm"><polygon points="22,0 100,0 100,24 32,24 24,32 24,106 100,106 100,130 0,130 0,22"/><polygon points="126,0 226,0 226,108 204,130 126,130"/><rect x="150" y="24" width="52" height="82" fill="#050506"/><rect x="252" y="0" width="24" height="130"/><rect x="252" y="0" width="86" height="24"/><polygon points="338,0 352,14 352,80 328,80 328,24 338,24"/><rect x="252" y="56" width="100" height="24"/><polygon points="296,80 322,80 352,130 324,130"/><rect x="378" y="0" width="24" height="130"/><rect x="378" y="0" width="86" height="24"/><polygon points="464,0 478,14 478,80 454,80 454,24 464,24"/><rect x="378" y="56" width="100" height="24"/><polygon points="504,0 604,0 604,108 582,130 504,130"/><rect x="528" y="24" width="52" height="82" fill="#050506"/></g>
</defs>
<style>
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Helvetica Neue','Segoe UI',Arial,sans-serif} .jp{font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP','Noto Sans CJK JP','MS Gothic',sans-serif}
  .blink{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}
  .gA{animation:ga 3.2s steps(1) infinite} @keyframes ga{0%{transform:translateX(0)}8%{transform:translateX(-14px)}10%{transform:translateX(9px)}12%{transform:translateX(0)}64%{transform:translateX(18px)}66%{transform:translateX(0)}}
  .gB{animation:gb 2.3s steps(1) infinite} @keyframes gb{0%{transform:translateX(0)}30%{transform:translateX(12px)}33%{transform:translateX(-7px)}35%{transform:translateX(0)}}
  .beam{animation:sc 5s linear infinite} @keyframes sc{from{transform:translateY(-80px)}to{transform:translateY(440px)}}
  .load{animation:ld 4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 0} @keyframes ld{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
  .flick{animation:fl 6s infinite} @keyframes fl{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.35}43%{opacity:1}45%{opacity:.6}46%{opacity:1}}
</style>
<rect width="1200" height="420" fill="#050506"/>
<rect width="1200" height="420" fill="url(#gridh)"/>
<rect width="1200" height="420" fill="url(#glowh)"/>
<text x="470" y="300" text-anchor="middle" class="jp" font-size="330" font-weight="900" fill="#FF1F3D" fill-opacity=".055">企業</text>

<!-- top rail -->
<path d="M40 44H1160" stroke="#FF1F3D" stroke-opacity=".6"/>
<path d="M40 44H280" stroke="#FF1F3D" stroke-width="4"/>
<text x="40" y="32" class="mono" font-size="13" letter-spacing="3" fill="#FF1F3D">CORPO SOLUTIONS // EXECUTIVE DIVISION</text>
<text x="1160" y="32" text-anchor="end" class="mono" font-size="13" letter-spacing="3" fill="#8A8D93">SYS.STATUS <tspan fill="#FF1F3D">ONLINE</tspan> <tspan class="blink" fill="#FF1F3D">■</tspan></text>

<!-- wordmark with glitch -->
<g transform="translate(70 92)" class="flick">
  <use href="#wm" fill="#00F0FF" fill-opacity=".55" transform="translate(-5 0)"/>
  <use href="#wm" fill="#FF1F3D" transform="translate(5 0)"/>
  <use href="#wm" fill="#EDEBE6"/>
  <g clip-path="url(#sliceA)"><g class="gA"><use href="#wm" fill="#FF1F3D"/></g></g>
  <g clip-path="url(#sliceB)"><g class="gB"><use href="#wm" fill="#00F0FF"/></g></g>
</g>
<text x="690.0" y="118" class="mono" font-size="14" fill="#FF1F3D">®</text>

<!-- identity line -->
<rect x="70" y="248" width="8" height="34" fill="#FF1F3D"/>
<text x="92" y="274" class="sans" fill="#EDEBE6"><tspan font-size="32" font-weight="800" letter-spacing="10">JUAN</tspan><tspan dx="10" font-size="20" font-weight="400" letter-spacing="4" fill="#8A8D93">/ CHIEF EXECUTIVE OFFICER</tspan></text>
<text x="92" y="306" class="mono" font-size="14" letter-spacing="4" fill="#FF1F3D">コーポ <tspan fill="#8A8D93">// MAN ON MANY MISSIONS</tspan></text>

<!-- personnel panel -->
<g transform="translate(790 78)">
  <rect width="370" height="236" fill="#0B0B0E" fill-opacity=".85" stroke="#FF1F3D" stroke-opacity=".25"/>
  <path d="M0 18V0H18 M352 0H370V18 M370 218V236H352 M18 236H0V218"
    fill="none" stroke="#FF1F3D" stroke-width="2"/>
  <rect x="0" y="0" width="370" height="30" fill="#FF1F3D"/>
  <text x="14" y="20" class="mono" font-size="13" font-weight="700" letter-spacing="3" fill="#050506">PERSONNEL FILE</text>
  <text x="356" y="20" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#050506">#00-001</text>
  <g class="mono" font-size="13" letter-spacing="1.5">
    <text x="16" y="62" fill="#8A8D93">SUBJECT</text><text x="354" y="62" text-anchor="end" fill="#EDEBE6">JUANSKR</text>
    <text x="16" y="90" fill="#8A8D93">RANK</text><text x="354" y="90" text-anchor="end" fill="#EDEBE6">CEO</text>
    <text x="16" y="118" fill="#8A8D93">SECTOR</text><text x="354" y="118" text-anchor="end" fill="#EDEBE6">ESPAÑA</text>
    <text x="16" y="146" fill="#8A8D93">DIVISIONS</text><text x="354" y="146" text-anchor="end" fill="#FF1F3D">03 ACTIVE</text>
    <text x="16" y="174" fill="#8A8D93">CLEARANCE</text><text x="354" y="174" text-anchor="end" fill="#EDEBE6"><tspan fill="#FF1F3D">██████████</tspan> LVL.9</text>
  </g>
  <path d="M16 46H354 M16 76H354 M16 104H354 M16 132H354 M16 160H354 M16 188H354" stroke="#EDEBE6" stroke-opacity=".07"/>
  <text x="16" y="212" class="mono" font-size="11" letter-spacing="2" fill="#8A8D93">DECRYPTING</text>
  <rect x="130" y="203" width="224" height="10" fill="none" stroke="#FF1F3D" stroke-opacity=".5"/>
  <rect x="132" y="205" width="220" height="6" fill="#FF1F3D" class="load"/>
</g>

<!-- bottom rail -->
<path d="M40 362H1160" stroke="#FF1F3D" stroke-opacity=".6"/>
<g stroke="#FF1F3D" stroke-opacity=".6"><path d="M40 362v8"/><path d="M60 362v8"/><path d="M80 362v8"/><path d="M100 362v14"/><path d="M120 362v8"/><path d="M140 362v8"/><path d="M160 362v8"/><path d="M180 362v8"/><path d="M200 362v14"/><path d="M220 362v8"/><path d="M240 362v8"/><path d="M260 362v8"/><path d="M280 362v8"/><path d="M300 362v14"/><path d="M320 362v8"/><path d="M340 362v8"/><path d="M360 362v8"/><path d="M380 362v8"/><path d="M400 362v14"/><path d="M420 362v8"/><path d="M440 362v8"/><path d="M460 362v8"/><path d="M480 362v8"/><path d="M500 362v14"/><path d="M520 362v8"/><path d="M540 362v8"/><path d="M560 362v8"/><path d="M580 362v8"/><path d="M600 362v14"/><path d="M620 362v8"/><path d="M640 362v8"/><path d="M660 362v8"/><path d="M680 362v8"/><path d="M700 362v14"/><path d="M720 362v8"/><path d="M740 362v8"/><path d="M760 362v8"/><path d="M780 362v8"/><path d="M800 362v14"/><path d="M820 362v8"/><path d="M840 362v8"/><path d="M860 362v8"/><path d="M880 362v8"/><path d="M900 362v14"/><path d="M920 362v8"/><path d="M940 362v8"/><path d="M960 362v8"/><path d="M980 362v8"/><path d="M1000 362v14"/><path d="M1020 362v8"/><path d="M1040 362v8"/><path d="M1060 362v8"/><path d="M1080 362v8"/><path d="M1100 362v14"/><path d="M1120 362v8"/><path d="M1140 362v8"/><path d="M1160 362v8"/></g>
<rect x="40" y="384" width="120" height="14" fill="url(#hazh)"/>
<text x="176" y="396" class="mono" font-size="11" letter-spacing="2" fill="#8A8D93">PROPERTY OF CORPO SOLUTIONS — UNAUTHORIZED ACCESS WILL BE PROSECUTED</text>
<g transform="translate(1006 378)"><g fill="#EDEBE6" fill-opacity=".55"><rect x="0" y="0" width="1" height="34"/><rect x="2" y="0" width="2" height="34"/><rect x="5" y="0" width="3" height="34"/><rect x="23" y="0" width="4" height="34"/><rect x="33" y="0" width="3" height="34"/><rect x="37" y="0" width="4" height="34"/><rect x="42" y="0" width="1" height="34"/><rect x="47" y="0" width="3" height="34"/><rect x="51" y="0" width="4" height="34"/><rect x="56" y="0" width="1" height="34"/><rect x="58" y="0" width="2" height="34"/><rect x="61" y="0" width="3" height="34"/><rect x="65" y="0" width="4" height="34"/><rect x="70" y="0" width="1" height="34"/><rect x="72" y="0" width="2" height="34"/><rect x="79" y="0" width="4" height="34"/><rect x="84" y="0" width="1" height="34"/><rect x="93" y="0" width="4" height="34"/><rect x="98" y="0" width="1" height="34"/><rect x="100" y="0" width="2" height="34"/><rect x="103" y="0" width="3" height="34"/><rect x="107" y="0" width="4" height="34"/><rect x="112" y="0" width="1" height="34"/><rect x="114" y="0" width="2" height="34"/><rect x="121" y="0" width="4" height="34"/><rect x="126" y="0" width="1" height="34"/><rect x="128" y="0" width="2" height="34"/><rect x="131" y="0" width="3" height="34"/><rect x="135" y="0" width="4" height="34"/><rect x="145" y="0" width="3" height="34"/></g></g>

<!-- scan beam + scanlines -->
<rect class="beam" x="0" y="0" width="1200" height="80" fill="url(#beamh)"/>
<rect width="1200" height="420" fill="url(#scanh)"/>
</svg>