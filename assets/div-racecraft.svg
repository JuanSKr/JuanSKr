<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="DIV-01">
<defs>
  <pattern id="gridd1" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#FF1F3D" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <pattern id="scand1" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" fill-opacity=".35"/>
  </pattern>
  <pattern id="hazd1" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="16" fill="#FFC72C"/>
  </pattern>
  <linearGradient id="beamd1" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#FF1F3D" stop-opacity="0"/>
    <stop offset="1" stop-color="#FF1F3D" stop-opacity=".22"/>
  </linearGradient>
  <radialGradient id="glowd1" cx=".3" cy=".45" r=".7">
    <stop offset="0" stop-color="#FF1F3D" stop-opacity=".18"/>
    <stop offset="1" stop-color="#FF1F3D" stop-opacity="0"/>
  </radialGradient></defs>
<style>.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Helvetica Neue','Segoe UI',Arial,sans-serif} .jp{font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP','Noto Sans CJK JP','MS Gothic',sans-serif}
.blink{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}
.pulse{animation:p 2.4s ease-in-out infinite} @keyframes p{0%,100%{opacity:.95}50%{opacity:.45}}
.beam{animation:sc 4.5s linear infinite} @keyframes sc{from{transform:translateY(-80px)}to{transform:translateY(270px)}}
.wave rect{transform-box:fill-box;transform-origin:center;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.knob{animation:kn 4s ease-in-out infinite} @keyframes kn{0%,15%{transform:translateX(0)}25%,85%{transform:translateX(26px)}95%,100%{transform:translateX(0)}}</style>
<rect width="1200" height="250" fill="#050506"/>
<rect width="1200" height="250" fill="url(#gridd1)"/>
<polygon points="10,10 1170,10 1190,30 1190,240 30,240 10,220" fill="#0B0B0E" stroke="#FF9F0A" stroke-opacity=".35"/>
<rect x="10" y="10" width="6" height="210" fill="#FF9F0A"/>
<text x="150" y="190" text-anchor="middle" class="jp" font-size="120" font-weight="900" fill="#FF9F0A" fill-opacity=".09">レース</text>
<text x="44" y="62" class="mono" font-size="14" letter-spacing="4" fill="#8A8D93">DIVISION</text>
<text x="40" y="128" class="mono" font-size="64" font-weight="800" fill="#FF9F0A">DIV-01</text>
<text x="44" y="166" class="jp" font-size="18" letter-spacing="6" fill="#8A8D93">レース</text>
<path d="M270 40V214" stroke="#FF9F0A" stroke-opacity=".35"/>
<text x="1160" y="52" text-anchor="end" class="mono" font-size="13" letter-spacing="3" fill="#FF9F0A"><tspan class="blink">●</tspan> LIVE // BETA</text>
<text x="300" y="76" class="sans" font-size="42" font-weight="800" letter-spacing="6" fill="#EDEBE6">RACECRAFT</text><text x="300" y="128" class="sans" font-size="20" fill="#EDEBE6" fill-opacity=".9">An AI race engineer for Le Mans Ultimate. It reads the game</text><text x="300" y="156" class="sans" font-size="20" fill="#EDEBE6" fill-opacity=".9">while you drive and talks to you over the radio, in real time.</text><rect x="300" y="196" width="180" height="24" fill="none" stroke="#FF9F0A" stroke-opacity=".7"/><text x="390.0" y="213" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#FF9F0A">ON-DEVICE VOICE AI</text><rect x="490" y="196" width="99" height="24" fill="none" stroke="#FF9F0A" stroke-opacity=".7"/><text x="539.5" y="213" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#FF9F0A">TELEMETRY</text><rect x="599" y="196" width="90" height="24" fill="none" stroke="#FF9F0A" stroke-opacity=".7"/><text x="644.0" y="213" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#FF9F0A">STRATEGY</text><rect x="699" y="196" width="81" height="24" fill="none" stroke="#FF9F0A" stroke-opacity=".7"/><text x="739.5" y="213" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#FF9F0A">ES / EN</text>
<rect class="beam" x="10" y="0" width="1180" height="80" fill="url(#beamd1)"/>
<rect width="1200" height="250" fill="url(#scand1)"/>
</svg>