<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="CORPO — end of transmission">
<defs>
  <pattern id="gridf" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#FF1F3D" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <pattern id="scanf" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" fill-opacity=".35"/>
  </pattern>
  <pattern id="hazf" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="16" fill="#FFC72C"/>
  </pattern>
  <linearGradient id="beamf" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#FF1F3D" stop-opacity="0"/>
    <stop offset="1" stop-color="#FF1F3D" stop-opacity=".22"/>
  </linearGradient>
  <radialGradient id="glowf" cx=".3" cy=".45" r=".7">
    <stop offset="0" stop-color="#FF1F3D" stop-opacity=".18"/>
    <stop offset="1" stop-color="#FF1F3D" stop-opacity="0"/>
  </radialGradient></defs>
<style>.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Helvetica Neue','Segoe UI',Arial,sans-serif} .jp{font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP','Noto Sans CJK JP','MS Gothic',sans-serif}
.blink{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}</style>
<rect width="1200" height="170" fill="#050506"/>
<rect width="1200" height="170" fill="url(#gridf)"/>
<path d="M40 30H1160" stroke="#FF1F3D" stroke-opacity=".6"/><path d="M920 30H1160" stroke="#FF1F3D" stroke-width="4"/>
<text x="40" y="84" class="sans" font-size="34" font-weight="800" letter-spacing="10" fill="#EDEBE6">THE FUTURE IS <tspan fill="#FF1F3D">BUILT</tspan>, NOT PREDICTED.</text>
<text x="40" y="116" class="mono" font-size="13" letter-spacing="3" fill="#8A8D93">END OF TRANSMISSION <tspan class="blink" fill="#FF1F3D">█</tspan>   //   通信終了</text>
<rect x="40" y="136" width="90" height="12" fill="url(#hazf)"/>
<text x="146" y="147" class="mono" font-size="11" letter-spacing="2" fill="#8A8D93">© CORPO SOLUTIONS · ESPAÑA</text>
